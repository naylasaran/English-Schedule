<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"
  >

  <title>Agenda de Aulas</title>

  <link
    rel="stylesheet"
    href="style.css?v=20260826-1"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script
    src="config.js"
  ></script>
</head>


<body>

  <!-- =====================================================
       CABEÇALHO
       ===================================================== -->

  <header class="site-header">

    <h1>
      Agenda de Aulas
    </h1>

  </header>


  <!-- =====================================================
       LOGIN
       ===================================================== -->

  <main>

    <section
      id="loginScreen"
      class="screen"
    >

      <div class="login-card">

        <h2>
          Entrar
        </h2>

        <form id="loginForm">

          <label for="email">
            E-mail
          </label>

          <input
            type="email"
            id="email"
            autocomplete="email"
            required
          >


          <label for="password">
            Senha
          </label>

          <input
            type="password"
            id="password"
            autocomplete="current-password"
            required
          >


          <button
            type="submit"
            class="primary-button"
          >
            Entrar
          </button>

        </form>


        <button
          type="button"
          id="forgotPasswordButton"
          class="link-button"
        >
          Esqueci minha senha
        </button>

        <div class="public-entry-actions">
          <button
            type="button"
            id="openPublicTeacherRegistrationButton"
            class="primary-button"
          >
            Cadastrar novo professor
            <small>15 dias gratis</small>
          </button>

          <button
            type="button"
            id="openPublicSupportButton"
            class="secondary-button"
          >
            Falar com o suporte
          </button>
        </div>


        <p
          id="loginMessage"
          class="message"
        ></p>

      </div>

      <div
        id="publicTeacherRegistrationCard"
        class="login-card public-form-card hidden"
      ></div>

      <div
        id="publicSupportCard"
        class="login-card public-form-card hidden"
      ></div>

    </section>


    <!-- ===================================================
         ÁREA DO ALUNO
         =================================================== -->

    <section
      id="studentScreen"
      class="screen hidden"
    >

      <nav
        id="studentNavigation"
        class="navigation"
      >

        <button
          type="button"
          class="nav-button active"
          data-student-page="agenda"
        >
          Agenda
        </button>

        <button
          type="button"
          class="nav-button"
          data-student-page="history"
        >
          Histórico
        </button>

        <button
          type="button"
          class="nav-button"
          data-student-page="makeups"
        >
          Reposições
        </button>

        <button
          type="button"
          class="nav-button"
          data-student-page="financial"
        >
          Mensalidade
        </button>

        <button
          type="button"
          class="nav-button"
          data-student-page="rules"
        >
          Regras
        </button>

      </nav>


      <div class="page-container">

        <div
          id="studentHeader"
          class="page-header"
        >
        </div>


        <div
          id="studentContent"
          class="page-content"
        >
        </div>

      </div>

    </section>


    <!-- ===================================================
         ÁREA DO PROFESSOR
         =================================================== -->

    <section
      id="teacherScreen"
      class="screen hidden"
    >

      <nav
        id="teacherNavigation"
        class="navigation"
      >

        <button
          type="button"
          class="nav-button active"
          data-teacher-page="agenda"
        >
          Agenda
        </button>

        <button
          type="button"
          class="nav-button"
          data-teacher-page="students"
        >
          Alunos
        </button>

        <button
          type="button"
          class="nav-button"
          data-teacher-page="attendance"
        >
          Presença/Faltas
        </button>

        <button
          type="button"
          class="nav-button"
          data-teacher-page="subjects"
        >
          Matérias
        </button>

        <button
          type="button"
          class="nav-button"
          data-teacher-page="planning"
        >
          Planejamento
        </button>

        <button
          type="button"
          class="nav-button"
          data-teacher-page="financial"
        >
          Financeiro
        </button>

        <button
          type="button"
          class="nav-button"
          data-teacher-page="rules"
        >
          Regras
        </button>

      </nav>


      <div class="page-container">

        <div
          id="teacherHeader"
          class="page-header"
        >
        </div>


        <div
          id="teacherContent"
          class="page-content"
        >
        </div>

      </div>

    </section>

  </main>


  <!-- =====================================================
       RODAPÉ
       ===================================================== -->

  <footer class="site-footer">

    <button
      type="button"
      id="logoutButton"
      class="logout-button"
    >
      Sair
    </button>

  </footer>


  <!-- =====================================================
       JAVASCRIPT DO SITE
       ===================================================== -->

  <script
    src="app.js?v=20260826-1"
  ></script>

</body>

</html>
